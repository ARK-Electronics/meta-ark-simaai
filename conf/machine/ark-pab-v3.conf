#@TYPE: Machine
#@NAME: ark-pab-v3
#@DESCRIPTION: ARK Jetson PAB V3 carrier with SiMa.ai Modalix SoM

require conf/machine/include/ark-modalix-common.inc

# Board identity
ARK_BOARD = "pab-v3"
ARK_BOARD_NAME = "Jetson PAB V3"
ARK_DEFAULT_DTBO = "ark-pab-v3.dtbo"
# Carrier GPIO defaults: recipes-bsp/u-boot/files/gpios-ark-pab-v3.cmd

# Prefer 16G SoM DTB + PAB V3 overlay.
# U-Boot: setenv fdt_name modalix-som_16g.dtb; setenv dtbos ark-pab-v3.dtbo; saveenv
KERNEL_DEVICETREE = "simaai/modalix-som_16g.dtb simaai/modalix-som.dtb"
DEVICETREE_NAME = "modalix-som_16g.dtb;boot-0/ modalix-som_16g.dtb;boot-1/ \
                   modalix-som.dtb;boot-0/ modalix-som.dtb;boot-1/"

MACHINE_ESSENTIAL_EXTRA_RDEPENDS += "ark-carrier-dtbo"
