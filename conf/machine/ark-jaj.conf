#@TYPE: Machine
#@NAME: ark-jaj
#@DESCRIPTION: ARK Just a Jetson carrier with SiMa.ai Modalix SoM

require conf/machine/include/ark-modalix-common.inc

# Board identity
ARK_BOARD = "jaj"
ARK_BOARD_NAME = "Just a Jetson"
ARK_DEFAULT_DTBO = "ark-jaj.dtbo"

# Prefer 16G SoM DTB (matches shipping Modalix 16Gig modules) + JAJ overlay.
# U-Boot: setenv fdt_name modalix-som_16g.dtb; setenv dtbos ark-jaj.dtbo; saveenv
KERNEL_DEVICETREE = "simaai/modalix-som_16g.dtb simaai/modalix-som.dtb"
DEVICETREE_NAME = "modalix-som_16g.dtb;boot-0/ modalix-som_16g.dtb;boot-1/ \
                   modalix-som.dtb;boot-0/ modalix-som.dtb;boot-1/"

# Install carrier DTBO into the image
MACHINE_ESSENTIAL_EXTRA_RDEPENDS += "ark-carrier-dtbo"
